/* ---------- Атмосфера: цветной тон раздела и размытое фото сорта ---------- */
function toneName(){
  const s = state.screen;
  if(s === 'cat') return state.cat === 'orn' ? 'orn' : state.cat === 'pear' ? 'pear' : 'apple';
  if(s === 'detail'){ const v = VARIETIES.find(x => x.id === state.id); return v ? (v.cat === 'orn' ? 'orn' : v.cat === 'pear' ? 'pear' : 'apple') : 'home'; }
  if(s === 'pests' || s === 'pest' || s === 'diag') return 'pest';
  if(s === 'basics' || s === 'topic' || s === 'garden') return 'basics';
  if(s === 'cal') return 'plan';
  return 'home';
}
function atmoHtml(){
  let photo = '';
  if(state.screen === 'detail'){
    const v = VARIETIES.find(x => x.id === state.id); const ps = v ? photoList(v) : [];
    const asrc = v && v.imageBlur ? v.imageBlur : '';
    if(asrc) photo = `<div class="atmo-photo" style="background-image:url('${asrc}')"></div><div class="atmo-veil"></div>`;
  }
  return `<div class="atmo" data-tone="${toneName()}" aria-hidden="true"></div>${photo}`;
}

function screenHtml(withSprite){
  const scr = state.screen;
  return swapEmoji((withSprite ? getSprite() : '') + atmoHtml() + (scr === 'home' ? home() : scr === 'catalog' ? catalogScreen() : scr === 'cat' ? category() : scr === 'favs' ? favsScreen() : scr === 'quiz' ? quizScreen() : scr === 'cal' ? calScreen() : scr === 'basics' ? basicsScreen() : scr === 'topic' ? topicScreen() : scr === 'pests' ? pestsScreen() : scr === 'pest' ? pestScreen() : scr === 'garden' ? gardenScreen() : scr === 'diag' ? diagScreen() : detail()) + bottomNav());
}

let zoomOpen = false;
function closeZoom(){ try { document.querySelectorAll('.zoomer').forEach(n => { if(typeof n.remove === 'function') n.remove(); }); } catch(e) {} zoomOpen = false; }
function openZoom(src, alt){
  if(typeof document.createElement !== 'function' || !document.body || typeof document.body.appendChild !== 'function') return;
  closeZoom();
  // все фото галереи текущей карточки: в просмотре их можно листать
  let list = [];
  try { list = Array.from(document.querySelectorAll('#gallery .zoom-btn')).map(b => ({src: b.dataset.zoom, alt: b.dataset.alt})); } catch(e) {}
  let idx = list.findIndex(p => p.src === src);
  if(idx < 0){ list = [{src, alt}]; idx = 0; }
  const esc = t => String(t || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const box = document.createElement('div'); box.className = 'zoomer'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Фото крупно');
  box.innerHTML = '<div class="zoom-stage"><img class="zoom-img" src="' + esc(list[idx].src) + '" draggable="false" alt="' + esc(list[idx].alt || 'Фото') + '"></div>'
    + '<button class="zoom-x" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
    + (list.length > 1 ? '<span class="zoom-count"></span>' : '')
    + '<span class="zoom-tip"><b class="zoom-cap"></b>Двумя пальцами или двойным касанием — увеличить. Нажмите мимо фото, чтобы закрыть</span>';
  if(typeof box.addEventListener === 'function') box.addEventListener('click', e => {
    const tg = e.target;
    if(tg && tg.closest && tg.closest('.zoom-x')) closeZoom();
  });
  document.body.appendChild(box); zoomOpen = true;
  const q = sel => box.querySelector ? box.querySelector(sel) : null;
  const stage = q('.zoom-stage'), img = q('.zoom-img'), cnt = q('.zoom-count'), cap = q('.zoom-cap');
  const show = i => {
    idx = i;
    if(img){ img.src = list[i].src; img.alt = list[i].alt || 'Фото'; }
    if(cnt) cnt.textContent = (i + 1) + ' / ' + list.length;
    if(cap) cap.textContent = String(list[i].alt || '').split(':')[0];
    // карточка под просмотром листается вместе с ним
    try { const g = document.getElementById('gallery'); if(g) g.scrollLeft = i * g.clientWidth; } catch(e) {}
  };
  show(idx);
  if(stage && img && stage.addEventListener) setupZoom(stage, img, {
    count: list.length,
    can: d => idx + d >= 0 && idx + d < list.length,
    go: d => show(idx + d),
    close: closeZoom
  });
}

// Масштаб фото: s — увеличение, x/y — сдвиг. Точка под пальцами остаётся на месте.
function setupZoom(stage, img, ctl){
  let s = 1, x = 0, y = 0, start = null, lastTap = 0, lastTapX = 0, lastTapY = 0, moved = false, swipe = 0, busy = false;
  const MAX = 5;
  const box = () => stage.getBoundingClientRect();
  const clamp = () => {
    const r = box();
    if(s <= 1){ s = 1; x = 0; y = 0; return; }
    x = Math.min(0, Math.max(r.width - r.width * s, x));
    y = Math.min(0, Math.max(r.height - r.height * s, y));
  };
  const apply = anim => {
    img.classList.toggle('anim', !!anim);
    img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  };
  const pt = t => { const r = box(); return {x: t.clientX - r.left, y: t.clientY - r.top}; };
  // где на экране сейчас само фото (без тёмных полей вокруг)
  const inPhoto = p => {
    const r = box(), nw = img.naturalWidth || r.width, nh = img.naturalHeight || r.height, k = nw / nh;
    let w = r.width, h = r.height;
    if(r.width / r.height > k) w = r.height * k; else h = r.width / k;
    const ox = (r.width - w) / 2, oy = (r.height - h) / 2;
    const L = x + ox * s, T = y + oy * s;
    return p.x >= L && p.x <= L + w * s && p.y >= T && p.y <= T + h * s;
  };
  const zoomAt = (px, py, ns) => {
    ns = Math.max(1, Math.min(MAX, ns));
    const qx = (px - x) / s, qy = (py - y) / s;
    s = ns; x = px - qx * s; y = py - qy * s; clamp();
  };
  // перелистывание: фото уезжает в сторону, приезжает следующее
  const turn = d => {
    const w = box().width;
    busy = true; x = -d * w; apply(true);
    setTimeout(() => {
      ctl.go(d);
      x = d * w; apply(false);
      setTimeout(() => { x = 0; apply(true); busy = false; }, 20);
    }, 200);
  };
  stage.addEventListener('touchstart', e => {
    if(busy) return;
    const t = e.touches;
    if(t.length === 2){
      const a = pt(t[0]), b = pt(t[1]);
      start = {pinch: true, d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, s, x, y};
      swipe = 0;
    } else if(t.length === 1){
      const a = pt(t[0]);
      start = {pinch: false, px: a.x, py: a.y, x, y};
    }
    moved = false;
  }, {passive: true});
  stage.addEventListener('touchmove', e => {
    if(!start || busy) return;
    if(e.cancelable) e.preventDefault();
    const t = e.touches;
    if(start.pinch && t.length >= 2){
      const a = pt(t[0]), b = pt(t[1]);
      const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const ns = Math.max(1, Math.min(MAX, start.s * d / start.d));
      const qx = (start.cx - start.x) / start.s, qy = (start.cy - start.y) / start.s;
      s = ns; x = cx - qx * s; y = cy - qy * s; clamp(); apply(false); moved = true;
    } else if(!start.pinch && t.length === 1){
      const a = pt(t[0]), dx = a.x - start.px, dy = a.y - start.py;
      if(Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      if(s > 1){ x = start.x + dx; y = start.y + dy; clamp(); apply(false); }
      else if(ctl.count > 1 && (swipe || Math.abs(dx) > Math.abs(dy))){
        // у первого и последнего фото сдвиг «пружинит»
        swipe = dx; x = ctl.can(dx < 0 ? 1 : -1) ? dx : dx * 0.3; apply(false);
      }
    }
  }, {passive: false});
  stage.addEventListener('touchend', e => {
    if(e.cancelable && !e.touches.length) e.preventDefault();   // касание не превращается в щелчок
    if(busy) return;
    if(e.touches.length === 1){ const a = pt(e.touches[0]); start = {pinch: false, px: a.x, py: a.y, x, y}; return; }
    if(e.touches.length) return;
    const wasPinch = start && start.pinch; start = null;
    if(swipe){
      const d = swipe < 0 ? 1 : -1, far = Math.abs(swipe) > Math.min(90, box().width / 4);
      swipe = 0;
      if(far && ctl.can(d)){ turn(d); return; }
      x = 0; apply(true); return;
    }
    if(wasPinch || moved) return;
    const c = e.changedTouches && e.changedTouches[0]; if(!c) return;
    const p = pt(c), now = Date.now();
    if(!inPhoto(p)){ lastTap = 0; if(e.cancelable) e.preventDefault(); ctl.close(); return; }   // без «призрачного» нажатия по карточке под просмотром
    if(now - lastTap < 320 && Math.abs(p.x - lastTapX) < 30 && Math.abs(p.y - lastTapY) < 30){
      if(s > 1){ s = 1; x = 0; y = 0; } else zoomAt(p.x, p.y, 2.5);
      apply(true); lastTap = 0;
    } else { lastTap = now; lastTapX = p.x; lastTapY = p.y; }
  });
  // компьютер: щелчок мимо фото закрывает, двойной щелчок и колёсико увеличивают, стрелки листают
  stage.addEventListener('click', e => { if(e.pointerType === 'touch' || (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)) return; if(!inPhoto(pt(e))) ctl.close(); });
  stage.addEventListener('dblclick', e => { const p = pt(e); if(!inPhoto(p)) return; if(s > 1){ s = 1; x = 0; y = 0; } else zoomAt(p.x, p.y, 2.5); apply(true); });
  stage.addEventListener('wheel', e => { if(e.cancelable) e.preventDefault(); const p = pt(e); zoomAt(p.x, p.y, s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); apply(false); }, {passive: false});
  let drag = null;
  stage.addEventListener('mousedown', e => { if(s > 1) drag = {px: e.clientX, py: e.clientY, x, y}; });
  stage.addEventListener('mousemove', e => { if(!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; clamp(); apply(false); });
  ['mouseup','mouseleave'].forEach(ev => stage.addEventListener(ev, () => { drag = null; }));
}

function render(){
  if(hasHistory && !histReady) initNav();
  const keepFocus = document.activeElement && document.activeElement.id === 'q';
  const pos = keepFocus ? document.activeElement.selectionStart : 0;
  const scr = state.screen;

  app.innerHTML = screenHtml(true);

  if(keepFocus){ const i = document.getElementById('q'); if(i){ i.focus(); i.setSelectionRange(pos,pos); } }
  if(scr === 'cat' && state.cq) applyCq();
  if(scr === 'detail' && document.getElementById){
    const gal = document.getElementById('gallery');
    if(gal && gal.addEventListener){
      gal.addEventListener('scroll', () => {
        const i = Math.round(gal.scrollLeft / Math.max(gal.clientWidth, 1));
        document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
      }, {passive:true});
    }
  }
  if(scr === 'cal' && document.querySelector){ const c = document.querySelector('.mchip[aria-pressed="true"]'); if(c && c.scrollIntoView) c.scrollIntoView({inline:'center', block:'nearest'}); }
  const lv = document.getElementById('live');
  if(lv && lv !== app){ lv.textContent = (state.screen === 'home' && state.query.trim()) ? (lastSearchCount ? 'Найдено результатов: ' + lastSearchCount : 'Ничего не найдено') : ''; }
  const k = viewKey();
  if(k !== lastViewKey){
    const y = navMode === 'back' ? (scrollMem[k] || 0) : 0;
    lastViewKey = k; navMode = 'forward';
    window.scrollTo(0, y);
    if(y){ if(typeof requestAnimationFrame === 'function') requestAnimationFrame(() => window.scrollTo(0, y)); setTimeout(() => window.scrollTo(0, y), 60); }
  }
  syncHistory();
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  rememberScroll(); navMode = d.back !== undefined ? 'back' : 'forward';
  if(d.zoom !== undefined){ openZoom(d.zoom, d.alt); return; }
  if(d.themeToggle !== undefined){ toggleTheme(); render(); return; }
  if(d.q !== undefined){ state.query = d.q; render(); return; }
  if(d.editTree !== undefined){ state.editTree = d.editTree; state.formOpen = true; state.formError = ''; state.confirmDel = null; render(); return; }
  if(d.delTree !== undefined){ state.confirmDel = d.delTree; render(); return; }
  if(d.delTreeNo !== undefined){ state.confirmDel = null; render(); return; }
  if(d.delTreeYes !== undefined){ saveGarden(getGarden().filter(x => x.id !== d.delTreeYes)); state.confirmDel = null; render(); return; }
  if(d.diagClose !== undefined){ diagState.symptom = null; render(); return; }
  if(d.tab){
    const applyTab = () => {
      state.screen = d.tab;
      state.back = 'home';
      if(d.tab === 'garden'){ state.formOpen = false; state.editTree = null; state.confirmDel = null; }
      if(d.tab === 'cal') state.month = nowMonth;
      if(d.tab !== 'home' && d.tab !== 'catalog') state.query = '';
      if(hasHistory) replaceNext = true;     // вкладка нижней панели не добавляет шаг назад
      render();
    };
    if(hasHistory && histIndex > 0 && !(histIndex === 1 && state.screen === d.tab)) goRoot(applyTab); else applyTab();
    return;
  }
  
// Для определителя
  if(d.rate){ const n = +d.stars || 0; if(myRates[d.rate] === n) delete myRates[d.rate]; else myRates[d.rate] = n; saveRates(); render(); return; }
  if(d.diagCrop){ diagState.crop = d.diagCrop; diagState.symptom = null; render(); return; }
  if(d.diagSymptom){ diagState.symptom = d.diagSymptom; render(); return; }

  // Переход из Моего сада в карточку
  if(d.treeId && d.id){
    state.back = 'garden';
    state.screen = 'detail';
    state.id = d.id;
    render();
    return;
  }

  if(d.cat){ state.screen='cat'; state.cat=d.cat; state.filter='Все'; state.cq=''; }
  else if(d.id){
    state.back = ['cat','favs','cal','topic','pest','catalog'].includes(state.screen) ? state.screen : 'home';
    if(state.screen === 'home') state.cat = null;
    state.screen='detail'; state.id=d.id; }
  else if(d.filter){ state.filter = d.filter; }
  else if(d.back){ 
    if (d.back === 'garden' && state.formOpen) {
      state.formOpen = false; state.editTree = null; state.formError = '';
      render();
    } else if (goBack(d.back)) {
      return;                       // вернулись на предыдущий экран по истории переходов
    } else {
      if(hasHistory) replaceNext = true;
      state.screen = d.back; }
  }
else if(d.go){ state.screen = d.go; if(d.go === 'quiz' && !state.quiz) newCard(); if(d.go === 'cal') state.month = nowMonth; }
  else if(d.fav){ favs.has(d.fav) ? favs.delete(d.fav) : favs.add(d.fav); saveFavs(); }
  
  // === МОЙ САД ===
  else if (d.go === 'garden') {
    state.screen = 'garden';
    state.formOpen = false;
    render();
  }
  else if (d.addTree !== undefined) {
    state.editTree = null; state.formError = ''; state.formOpen = true;
    render();
  }
  else if (d.saveTree !== undefined) {
    const sortId = document.getElementById('f-sort').value;
    const customEl = document.getElementById('f-custom');
    const customName = sortId ? '' : ((customEl && customEl.value) || '').trim();
    const year = parseInt(document.getElementById('f-year').value);
    const place = document.getElementById('f-place').value.trim();
    if ((!sortId && !customName) || !year || year < 1900 || year > new Date().getFullYear()) { state.formError = 'Выберите сорт из списка или впишите своё название и укажите год посадки (от 1900 до текущего).'; render(); return; }
    const garden = getGarden();
    if (state.editTree) {
      const i = garden.findIndex(x => x.id === state.editTree);
      if (i >= 0) garden[i] = {...garden[i], sortId, customName, year, place};
    } else {
      garden.push({ id: Date.now().toString(), sortId, customName, year, place });
    }
    saveGarden(garden);
    state.formOpen = false; state.editTree = null; state.formError = '';
    render();
  }
  // ================

  else if(d.quiz){
    if(d.quiz === 'show'){ state.quiz.shown = true; }
    else { quizStats.total++; if(d.quiz === 'yes') quizStats.known++; newCard(); }
  }
  else if(d.month){ state.month = Number(d.month); }
  else if(d.pest){ state.pestBack = (state.screen === 'pests' || state.screen === 'pest') ? 'pests' : state.screen; state.pest = d.pest; state.screen = 'pest'; }
  else if(d.pfilter){ state.pestFilter = d.pfilter; }
  else if(d.topic){ state.topicBack = (state.screen === 'basics' || state.screen === 'topic') ? 'basics' : state.screen; state.topic = d.topic; state.screen = 'topic'; }
  else if(d.mgo){ state.month = Number(d.mgo); state.screen = 'cal'; }
  else if(d.task){ const [mm, id] = d.task.split(':'); const k = doneKey(Number(mm), id); doneSet.has(k) ? doneSet.delete(k) : doneSet.add(k); saveDone(); }
  else return;
  render();
});

function applyCq(){
  const box = document.getElementById && document.getElementById('cq-list');
  if(!box || !box.querySelectorAll) return;
  const q = String(state.cq || '').trim().toLowerCase().replace(/ё/g, 'е');
  let n = 0;
  box.querySelectorAll('.row').forEach(r => { const ok = !q || String(r.getAttribute('data-s') || '').includes(q); r.hidden = !ok; if(ok) n++; });
  const none = document.getElementById('cq-none'); if(none) none.hidden = !(q && n === 0);
}
app.addEventListener('input', e => {
  if(e.target.id === 'cq'){ state.cq = e.target.value; applyCq(); return; }
  if(e.target.id === 'q'){ state.query = e.target.value; render(); }
});

// Свайп от левого края вправо — переход назад, как в iOS. Нужен только без истории браузера: иначе работает системный жест.
if(!hasHistory){
let backSwipeStart = null;
document.addEventListener('touchstart', e => {
  if (!e.touches || e.touches.length !== 1) { backSwipeStart = null; return; }
  const touch = e.touches[0];
  const target = e.target;
  // Не перехватываем жесты внутри полей ввода и выделение текста.
  if (target.closest('input, textarea, select, [contenteditable="true"]')) { backSwipeStart = null; return; }
  backSwipeStart = { x: touch.clientX, y: touch.clientY, edge: touch.clientX <= 28, t: Date.now() };
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!backSwipeStart || !backSwipeStart.edge || !e.changedTouches || !e.changedTouches.length) {
    backSwipeStart = null; return;
  }
  const touch = e.changedTouches[0];
  const dx = touch.clientX - backSwipeStart.x;
  const dy = touch.clientY - backSwipeStart.y;
  const startT = backSwipeStart.t || 0;
  backSwipeStart = null;
  // Только уверенный горизонтальный свайп от левого края.
  if (dx < 85 || Math.abs(dy) > 70 || Math.abs(dx) < Math.abs(dy) * 1.25) return;

  if (state.screen === 'garden' && state.formOpen) {
    state.formOpen = false; state.editTree = null; state.formError = ''; render(); return;
  }
  rememberScroll(); navMode = 'back';
  if (state.screen === 'detail') {
    state.screen = state.back || 'home';
  } else if (state.screen === 'topic') {
    state.screen = state.topicBack || 'basics';
  } else if (state.screen === 'pest') {
    state.screen = state.pestBack || 'pests';
  } else if (state.screen === 'garden' && state.formOpen) {
    state.formOpen = false; state.editTree = null; state.formError = '';
  } else if (state.screen !== 'home') {
    if (state.screen === 'cal') state.month = nowMonth;
    state.screen = 'home';
    state.query = '';
  } else {
    return;
  }
  render();
}, { passive: true });

document.addEventListener('touchcancel', () => { backSwipeStart = null; }, { passive: true });
}

if(hasHistory){
  if(!ownNav) window.addEventListener('popstate', e => handlePop(e.state));
  const persist = () => { try { H.replaceState({sad:true, idx:histIndex, snap:navSnap()}, ''); } catch(e) {} };
  window.addEventListener('pagehide', persist);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') persist(); });
}

/* ---------- Свой жест «Назад» для iPhone: страница едет за пальцем, под ней виден предыдущий экран ---------- */
const SLIDE_MS = 230;
let sliding = false, slideT = 0;
// страховка: если жест оборвался и слой завис, следующее касание его убирает
function clearLayers(){ try { document.querySelectorAll('.nav-layer').forEach(n => { if(typeof n.remove === 'function') n.remove(); }); } catch(e) {} sliding = false; }
function htmlForSnap(sn){
  const keep = {}; NAV_KEYS.forEach(k => { keep[k] = state[k]; });
  const fo = state.formOpen, cd = state.confirmDel, fe = state.formError, qz = state.quiz, dc = diagState.crop, ds = diagState.symptom;
  try { applySnap(sn); return {html: screenHtml(false), y: scrollMem[viewKey()] || 0}; }
  finally { NAV_KEYS.forEach(k => { state[k] = keep[k]; }); state.formOpen = fo; state.confirmDel = cd; state.formError = fe; state.quiz = qz; diagState.crop = dc; diagState.symptom = ds; }
}
function buildSlideLayer(delta){
  if(!ownNav || histIndex + delta < 0 || typeof document.createElement !== 'function' || !document.body || typeof document.body.appendChild !== 'function') return null;
  const sn = H.snapAt(delta); if(!sn) return null;
  let prev; try { prev = htmlForSnap(sn); } catch(e) { return null; }
  const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; if(html !== undefined) d.innerHTML = html; return d; };
  const clone = (html, y) => '<div class="app-clone" style="position:absolute;left:0;right:0;top:' + (-y) + 'px">' + html + '</div>';
  const el = mk('nav-layer'); el.setAttribute('aria-hidden', 'true');
  const under = mk('nav-pane nav-under', clone(prev.html, prev.y));
  const shade = mk('nav-shade');
  const top = mk('nav-pane nav-top', clone(screenHtml(false), window.scrollY || 0));
  el.appendChild(under); el.appendChild(shade); el.appendChild(top);
  // слой показываем, когда картинки в нём готовы; до этого виден сам экран, он такой же
  document.body.appendChild(el);
  return {el, under, shade, top};
}
function setSlide(L, x, w){
  const p = w > 0 ? Math.max(0, Math.min(1, x / w)) : 0;
  L.top.style.transform = 'translate3d(' + x + 'px,0,0)';
  L.under.style.transform = 'translate3d(' + (-(w * 0.28) * (1 - p)) + 'px,0,0)';
  L.shade.style.opacity = String(0.22 * (1 - p));
}
function finishSlide(L, commit, w, done){
  const tr = 'transform ' + SLIDE_MS + 'ms cubic-bezier(.22,.8,.3,1), opacity ' + SLIDE_MS + 'ms linear';
  L.top.style.transition = tr; L.under.style.transition = tr; L.shade.style.transition = tr;
  void L.top.offsetWidth;
  setSlide(L, commit ? w : 0, w);
  setTimeout(() => { try { if(commit) done(); } finally { if(typeof L.el.remove === 'function') L.el.remove(); sliding = false; } }, SLIDE_MS + 20);
}
function slideBack(run, delta){
  if(sliding) return;
  const L = buildSlideLayer(delta);
  if(!L){ run(); return; }
  sliding = true; slideT = Date.now();
  const w = window.innerWidth || 390;
  setSlide(L, 0, w); finishSlide(L, true, w, run);
}
if(ownNav){
  let g = null;
  document.addEventListener('touchstart', e => {
    if((g || sliding) && Date.now() - slideT > 1500){ g = null; clearLayers(); }
    if(g || sliding || zoomOpen || histIndex <= 0 || !e.touches || e.touches.length !== 1) return;
    const t0 = e.touches[0];
    if(t0.clientX > 24) return;
    if(e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
    g = {x0: t0.clientX, y0: t0.clientY, active: false, L: null, curX: 0, lastX: t0.clientX, lastT: Date.now(), v: 0};
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(!g || !e.touches || e.touches.length !== 1) return;
    const t0 = e.touches[0], dx = t0.clientX - g.x0, dy = t0.clientY - g.y0;
    if(!g.active){
      if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ g = null; return; }      // это обычная прокрутка вниз или вверх
      if(dx < 8) return;
      g.L = buildSlideLayer(-1);
      if(!g.L){ g = null; return; }
      g.active = true; sliding = true;
    }
    slideT = Date.now();
    if(e.preventDefault) e.preventDefault();
    const w = window.innerWidth || 390;
    g.curX = Math.max(0, Math.min(w, dx));
    setSlide(g.L, g.curX, w);
    const now = Date.now(); if(now - g.lastT >= 16){ g.v = (t0.clientX - g.lastX) / (now - g.lastT); g.lastX = t0.clientX; g.lastT = now; }   // скорость считаем по отрезкам не короче одного кадра
  }, {passive: false});
  const endGesture = cancelled => {
    if(!g) return; const gg = g; g = null; if(!gg.active) return;
    const w = window.innerWidth || 390;
    const commit = !cancelled && (gg.curX > w * 0.35 || gg.v > 0.5);
    finishSlide(gg.L, commit, w, () => { rememberScroll(); navMode = 'back'; H.back(); });
  };
  document.addEventListener('touchend', () => endGesture(false), {passive: true});
  document.addEventListener('touchcancel', () => endGesture(true), {passive: true});
}

/*@@START@@*/

/* ---------- Установка и работа без интернета ---------- */
if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadController && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
