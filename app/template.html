<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Сад">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F1">
<title>Справочник садовода</title>
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1A1D1A; --muted:#586159; --line:#E4E8E2;
  --apple:#B3262E; --pear:#A9B02E; --stone:#7A3E5C; --grape:#4B3B7A; --berry:#C2417A; --veg:#D9822B; --basics:#2C4A3E; --plan:#3E7C8C; --pest:#8C4A2F;
  --on-tile:#FFFFFF; --font-sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; --font-serif: -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.45}
.serif{font-family:var(--font-serif)}
#app,.app-clone{max-width:520px;margin:0 auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--basics);outline-offset:2px;border-radius:12px}

/* iOS / Bento home */
#app,.app-clone{max-width:560px;margin:0 auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom))}
.hero-home{position:relative;min-height:124px;border-radius:0;overflow:visible;margin:0 0 18px;color:var(--ink);display:flex;flex-direction:column;justify-content:center;padding:0;background:transparent}
.hero-home::after{display:none}
.hero-home h1,.hero-home p{position:relative;z-index:1}
.hero-home h1{font-size:30px;line-height:1.08;font-weight:780;letter-spacing:-.045em;margin-bottom:7px}
.hero-home p{font-size:14px;color:var(--muted);opacity:1}
.search{position:relative;margin:0 0 12px}
.row[hidden]{display:none!important}
.search.cq{margin:2px 0 12px}
.search::before{content:'⌕';position:absolute;left:15px;top:7px;font-size:25px;line-height:1;color:#7C857D;pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;padding:14px 15px 14px 43px;border-radius:17px;border:1px solid transparent;background:#E8ECE7;color:var(--ink);outline:none}
.search input:focus{border-color:#A8B8AA;background:#fff}
.home-diagnose{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;margin:0 0 18px;border-radius:19px;background:#2C4A3E;color:#fff;box-shadow:0 6px 18px rgba(30,56,43,.12)}
.home-diagnose .hd-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.14);font-size:23px}
.home-diagnose .hd-copy{flex:1;min-width:0}
.home-diagnose strong{display:block;font-size:15px;line-height:1.25}
.home-diagnose small{display:block;font-size:12px;opacity:.78;margin-top:3px}
.home-diagnose .hd-arrow{font-size:23px;opacity:.8}
.bento{display:grid;grid-template-columns:1.12fr .88fr;gap:11px;margin-bottom:25px}
.bento-card{min-width:0;min-height:148px;border-radius:21px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 4px 20px rgba(25,35,27,.045)}
.bento-calendar{grid-column:1/-1;min-height:158px;background:#2C4A3E;color:#fff;position:relative;overflow:hidden}
.bento-calendar::after{content:'✳';position:absolute;right:9px;top:-27px;font-size:125px;line-height:1;color:rgba(255,255,255,.07);transform:rotate(-15deg)}
.bento-card .bc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;opacity:.8}
.bento-card .bc-icon{font-size:20px;flex:none}
/* Keep each Bento heading and subtitle on separate, predictable lines. */
.bento-card > span:last-child{display:block;width:100%;min-width:0;position:relative;z-index:1}
.bento-card .bc-title{display:block;font-size:20px;line-height:1.16;font-weight:750;letter-spacing:-.035em;max-width:280px;white-space:normal;overflow-wrap:break-word;position:relative;z-index:1}
.bento-card .bc-sub{display:block;font-size:12px;line-height:1.45;opacity:.78;margin-top:8px;white-space:normal;overflow-wrap:break-word;position:relative;z-index:1}
.bento-garden{background:#E2E9DE;color:#243B2D}
.bento-garden .bc-title{font-size:18px}
.bento-tip{background:#F4E9D8;color:#5A4933}
.bento-tip .bc-title{font-size:17px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-heading h2{font-size:23px;line-height:1.1;letter-spacing:-.04em;font-weight:780}
.section-heading button{font-size:13px;font-weight:650;color:#2C4A3E;white-space:nowrap}
.catalog-chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 13px;scrollbar-width:none}
.catalog-chips::-webkit-scrollbar{display:none}
.catalog-chip{flex:none;border-radius:999px;padding:8px 13px;background:#E8ECE7;color:#59635B;font-size:12px;font-weight:650}
.catalog-chip.active{background:#2C4A3E;color:#fff}
.catalog-chip:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;min-height:172px;aspect-ratio:auto;border-radius:20px;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:#fff;border:1px solid #E9ECE7;box-shadow:0 4px 20px rgba(25,35,27,.045)}
.tile .emoji{position:absolute;top:14px;right:10px;font-size:58px;line-height:1;opacity:1;transform:none;filter:drop-shadow(0 7px 8px rgba(40,45,30,.08))}
.tile::after{display:none}
.tile .t,.tile .n{position:relative;z-index:1}
.tile .t{font-size:17px;font-weight:750;line-height:1.15;letter-spacing:-.025em}
.tile .n{font-size:12px;color:var(--muted);margin-top:5px;opacity:1}
.tile.soon{filter:none;opacity:.68}
.note{margin-top:20px;font-size:12px;color:var(--muted);padding:13px 14px;border-radius:16px;background:#E8ECE7;border:0;line-height:1.5}
.pick{margin:0 0 22px}
.pick-t{font-size:13px;color:var(--ink);letter-spacing:-.02em;text-transform:none;font-weight:750;margin:0 2px 10px}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(250,251,249,.94);border-top:1px solid rgba(220,226,219,.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border-radius:12px;color:#858D85;text-align:center;font-size:10px;font-weight:650}
.tab-item .tab-icon{font-size:21px;line-height:1.15}
.tab-item.active{color:#2C4A3E}
.tab-item.active .tab-icon{transform:translateY(-1px)}
@media(min-width:520px){#app,.app-clone{padding-left:22px;padding-right:22px}.hero-home h1{font-size:34px}.tile{min-height:190px}}

/* nav & list */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.bar h2{font-size:30px;font-weight:700;line-height:1.1}
.bar h2.long{font-size:26px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:14px;align-items:center;width:100%;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.thumb{position:relative;flex:none;width:72px;height:72px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:38px;overflow:hidden}
.thumb img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.band img{width:100%;height:100%;display:block;object-fit:cover}
.photo-credit{font-size:11px;color:var(--muted);margin:-12px 0 16px;line-height:1.4}
.photo-credit a{color:var(--basics);text-decoration:underline;text-underline-offset:2px}
.row .name{font-size:18px;font-weight:700;line-height:1.2}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.rtext{flex:1;min-width:0}
.row .yr{flex:none;font-size:14px;color:var(--muted);align-self:flex-start;padding-top:2px}
.empty{padding:28px 8px;color:var(--muted);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px}

/* detail */
.credit{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.band{position:relative;height:112px;border-radius:22px;background:var(--c);display:grid;place-items:center;font-size:64px;overflow:hidden;margin-bottom:20px}
.d-title{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.d-cap{font-size:18px;font-style:italic;color:var(--muted);margin-bottom:18px}
.passport{margin:0 0 26px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:5px 16px}
.prow{display:grid;grid-template-columns:36% 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:last-child{border-bottom:1px solid var(--line)}
.prow dt{font-size:14px;color:var(--muted)}
.prow dd{font-size:17px;font-weight:600;line-height:1.3}
.prow dd small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
.sec{margin:0 0 24px}
.sec h3{font-size:26px;line-height:1.15;font-weight:700;margin-bottom:8px}
.bul{padding-left:20px;font-size:16px}
.bul li{margin:5px 0}
.quote{border-left:4px solid var(--c);padding:2px 0 2px 16px;margin:0 0 24px}
.quote h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:6px}
.quote p{font-size:22px;line-height:1.35;font-style:italic}

/* detail facts */
.detail-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--muted);margin-bottom:7px}
.quickfacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 27px}
.quickfact{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:14px 13px 13px}
.quickfact .q-label{display:block;font-size:11px;letter-spacing:.035em;color:var(--muted);margin-bottom:7px}
.quickfact .q-value{display:block;font-size:17px;font-weight:720;line-height:1.2;letter-spacing:-.035em;overflow-wrap:anywhere}
.quickfact.wide{grid-column:1 / -1}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 27px}
.rate-num{font-size:26px!important}
.rate-look{font-size:13px!important;color:var(--ink)!important;margin-top:6px!important}
.rate-look b{font-weight:720}
.rate-num small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.stars{display:flex;gap:2px;margin:-4px 0 0 -6px}
.star{width:36px;height:40px;padding:0;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);-webkit-tap-highlight-color:transparent}
.star .ico{width:26px;height:26px;stroke-width:1.6}
.star.on{color:#E0A100}
.star.on .ico{fill:currentColor}
.quickfact .q-value.unk{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.scab-chip{display:inline-flex;align-items:center;gap:6px;margin:-8px 0 4px;padding:6px 12px;border-radius:99px;background:rgba(47,125,70,.12);color:#2F7D46;font-size:13px;font-weight:650}
.scab-chip .ico{width:15px;height:15px}
:root[data-theme="dark"] .scab-chip{color:#7FCB95;background:rgba(127,203,149,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scab-chip{color:#7FCB95;background:rgba(127,203,149,.14)}}
.quickfact .q-note{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:5px}
.passport-title{font-family:var(--font-serif);font-size:25px;letter-spacing:-.035em;margin:0 0 4px}

/* actions & favs */
.actions{display:flex;gap:6px;margin:0 0 20px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 2px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:11px;box-shadow:0 3px 12px rgba(25,40,27,.03);text-align:center}
.act span{font-size:20px;margin-bottom:4px}
.heart{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;text-align:center}
.heart.on{color:#D1304A;border-color:#D1304A}

/* quiz */
.qstat{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 8px 26px rgba(22,40,25,.06)}
.q-kicker{font-size:12px;color:var(--muted);margin-bottom:4px}
.q-name{font-size:clamp(30px,9vw,40px);letter-spacing:-.04em;line-height:1.02;margin-bottom:14px}
.q-q{font-size:17px;color:var(--muted);margin-bottom:18px}
.q-a{font-size:19px;font-weight:650;line-height:1.35;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.q-btns{display:flex;gap:10px}
.qb{flex:1;text-align:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-weight:650}
.qb.yes{background:var(--basics);color:var(--bg);border-color:var(--basics)}
.qb.show{width:100%;background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* calendar */
.nowcard{display:flex;flex-direction:column;gap:9px;width:100%;margin:0 0 20px;padding:17px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 5px 18px rgba(20,35,22,.05)}
.nc-k{font-size:13px;color:var(--muted)}
.nc-list{display:flex;flex-direction:column;gap:6px}
.nc-i{font-size:17px;font-weight:650;letter-spacing:-.025em;padding-left:22px;position:relative}
.nc-i::before{content:"";position:absolute;left:0;top:4px;width:13px;height:13px;border-radius:50%;border:2px solid var(--basics)}
.nc-i.ok::before{background:var(--basics)}
.nc-more{font-size:14px;color:var(--basics);font-weight:650}
.ribbon{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:2px 18px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.mchip{flex:none;scroll-snap-align:center;position:relative;min-width:56px;text-align:center;padding:11px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:15px}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mchip.now::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--basics)}
.mchip.now[aria-pressed="true"]::after{background:var(--bg)}
.m-kicker{font-size:14px;color:var(--muted);margin-bottom:2px}
.m-title{font-size:clamp(40px,11vw,54px);line-height:.99;letter-spacing:-.055em;margin-bottom:14px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--basics);border-radius:99px;transition:width .25s ease}
.prog-t{font-size:13px;color:var(--muted);margin:8px 0 16px}
.task{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:21px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.task.done{opacity:.62}
.cb{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--basics);display:grid;place-items:center;padding:0;font-size:16px;line-height:1;text-align:center;color:var(--bg)}
.task.done .cb{background:var(--basics)}
.tb{min-width:0;flex:1}
.tg{display:inline-block;font-size:12px;font-weight:650;color:var(--muted);padding:3px 9px;border-radius:99px;background:var(--bg);margin-bottom:6px}
.tt{font-size:16px;line-height:1.4}
.tn{font-size:13px;color:var(--muted);line-height:1.45;margin-top:6px}

/* basics & pests */
.b-intro{font-size:16px;color:var(--muted);margin:-6px 0 18px;line-height:1.45}
.topic{display:flex;gap:14px;align-items:center;width:100%;padding:15px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.t-ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:27px}
.t-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.t-t{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.t-l{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gl{margin:0 0 27px}
.gl-i{padding:12px 0;border-bottom:1px solid var(--line)}
.gl-i dt{font-weight:700;font-size:17px;letter-spacing:-.02em}
.gl-i dd{font-size:15px;color:var(--muted);line-height:1.5;margin-top:3px}
.vl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vlink{padding:6px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--basics)}

/* Garden */
.my-garden-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.garden-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0 4px 14px rgba(25,40,27,.03); width: 100%; text-align: left; }
.garden-card .thumb { width: 60px; height: 60px; font-size: 30px; border-radius: 14px; }
.garden-card .info { flex: 1; min-width: 0; }
.garden-card .name { font-family: var(--font-serif); font-size: 19px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
.garden-card .meta { font-size: 13px; color: var(--muted); }
.garden-card .age { font-weight: 650; color: var(--basics); }
.add-btn { width: 100%; padding: 16px; border-radius: 20px; background: var(--basics); color: var(--bg); text-align: center; font-weight: 650; font-size: 16px; border: none; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(47, 107, 74, 0.2); }
.add-btn:active { transform: scale(0.98); }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-group select, .form-group input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; appearance: none; -webkit-appearance: none; }
.form-group select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%235C6B61%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 14px center; background-size: 12px; }
.empty-garden { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-garden h3 { font-family: var(--font-serif); font-size: 24px; color: var(--ink); margin-bottom: 10px; }
.empty-garden p { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
/* ---------- Определитель болезней ---------- */
.selector-box { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
.selector-box::-webkit-scrollbar { display: none; }
.sel-btn { flex: none; padding: 12px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: 15px; transition: 0.2s; }
.sel-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.symptom-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.symptom-card { width: 100%; text-align: left; padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 3px 12px rgba(25,40,27,.03); display: flex; justify-content: space-between; align-items: center; }
.symptom-card.active { border-color: var(--basics); background: color-mix(in srgb, var(--basics) 5%, var(--surface)); }
.symptom-card .s-t { font-size: 17px; font-weight: 650; }
.symptom-card .s-d { font-size: 13px; color: var(--muted); margin-top: 4px; }
.symptom-card .s-arrow { font-size: 20px; color: var(--muted); }

.result-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; margin-top: 20px; box-shadow: 0 8px 26px rgba(22,40,25,.06); }
.result-title { font-family: var(--font-serif); font-size: 28px; font-weight: 700; margin-bottom: 8px; line-height: 1.1; }
.result-desc { font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
.result-action { background: var(--bg); padding: 16px; border-radius: 16px; border-left: 4px solid var(--basics); font-size: 15px; line-height: 1.5; }
.result-action b { display: block; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; color: var(--basics); letter-spacing: 0.05em; }

/* shared modern surfaces */
.bar{gap:10px;margin-bottom:18px}
.bar h2{font-size:27px;font-weight:780;letter-spacing:-.04em}
.back{padding:9px 13px;border-radius:13px;background:#E8ECE7;border:0;font-size:14px}
.row,.topic,.nowcard,.qcard,.task,.garden-card,.result-card,.symptom-card,.quickfact,.passport{border:0;box-shadow:0 4px 20px rgba(25,35,27,.045);background:#fff}
.row{border-radius:18px}
.thumb{border-radius:15px}
.chip{border:0;background:#E8ECE7}
.chip[aria-pressed="true"]{background:#2C4A3E;color:#fff;border-color:#2C4A3E}
.add-btn{background:#2C4A3E;color:#fff;border-radius:17px;box-shadow:none}
/* keep form controls clear and readable */
input,select,textarea{font-family:var(--font-sans)}

/* immersive photo hero on the variety card */
.detail-view .hero-photo{position:relative;margin:26px -18px 18px;aspect-ratio:4/3;min-height:230px;max-height:min(400px,56vh);border-radius:26px;overflow:hidden;background:var(--c)}
.detail-view .hero-photo::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.30),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 72%,rgba(0,0,0,.20))}
.gallery{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gallery::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;background:var(--c)}
.slide::before{content:attr(data-e);position:absolute;inset:0;display:grid;place-items:center;font-size:96px}
.slide img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover}
.hero-emoji{height:100%;display:grid;place-items:center;font-size:104px}
.hero-bar{position:absolute;z-index:3;left:14px;right:14px;top:12px;display:flex;align-items:center;justify-content:space-between}
.hero-actions{display:flex;align-items:center;gap:8px}
.hero-bar .glass{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:0;color:#1A1D1A;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hero-bar .back{padding:10px 16px;font-weight:650}
.hero-bar .back.round,.hero-bar .heart{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center}
.hero-bar .back.round .ico{width:22px;height:22px;stroke-width:2.2;margin-left:-2px}
.hero-bar .heart{font-size:20px}
.hero-bar .glass{opacity:.92}
.hero-bar .heart{margin-left:0}
.hero-bar .heart.on{color:#D1304A}
.dots{position:absolute;z-index:3;left:0;right:0;bottom:15px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.55);transition:width .2s ease,background .2s ease}
.dots i.on{width:19px;background:#fff}
.detail-view .photo-credit{margin:-8px 0 16px}

/* theme button */
.theme-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:21px;line-height:1;padding:0;text-align:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.hero-home{position:relative}
.hero-home .home-theme{position:absolute;top:0;right:0}
.hero-bar .theme-btn.glass{background:rgba(255,255,255,.80);color:#1A1D1A;border:0}
:root[data-theme="light"]{color-scheme:light}
/* dark theme: explicit */
:root[data-theme="dark"]{--bg:#0E1310;--surface:#171E19;--ink:#EDF2EC;--muted:#9FAEA3;--line:#27312A;--basics:#8CC5A6;color-scheme:dark}
:root[data-theme="dark"] .search::before{color:#8A9B8F}
:root[data-theme="dark"] .search input{background:#1E2721}
:root[data-theme="dark"] .search input:focus{background:#232E27;border-color:#4C6A57}
:root[data-theme="dark"] .bento-garden{background:#1E2B22;color:#D3E6D8}
:root[data-theme="dark"] .bento-tip{background:#2C2619;color:#EBDDC2}
:root[data-theme="dark"] .section-heading button{color:#8CC5A6}
:root[data-theme="dark"] .catalog-chip{background:#1E2721;color:#B8C6BC}
:root[data-theme="dark"] .catalog-chip.active{background:#3F6F59;color:#fff}
:root[data-theme="dark"] .tile{background:#171E19;border-color:#27312A}
:root[data-theme="dark"] .note{background:#1E2721}
:root[data-theme="dark"] .bottom-nav{background:rgba(16,21,18,.92);border-top-color:rgba(255,255,255,.08)}
:root[data-theme="dark"] .tab-item{color:#8E9B92}
:root[data-theme="dark"] .tab-item.active{color:#8CC5A6}
:root[data-theme="dark"] .back{background:#1E2721}
:root[data-theme="dark"] .row,:root[data-theme="dark"] .topic,:root[data-theme="dark"] .nowcard,:root[data-theme="dark"] .qcard,:root[data-theme="dark"] .task,:root[data-theme="dark"] .garden-card,:root[data-theme="dark"] .result-card,:root[data-theme="dark"] .symptom-card,:root[data-theme="dark"] .quickfact,:root[data-theme="dark"] .passport{background:#171E19;box-shadow:0 4px 20px rgba(0,0,0,.35)}
:root[data-theme="dark"] .chip{background:#1E2721}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:#3F6F59;border-color:#3F6F59;color:#fff}
:root[data-theme="dark"] .add-btn{background:#3F6F59;color:#fff}
:root[data-theme="dark"] .theme-btn{background:#1E2721;color:#EDF2EC}
/* dark theme: follows the system unless the user picked a theme */
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--bg:#0E1310;--surface:#171E19;--ink:#EDF2EC;--muted:#9FAEA3;--line:#27312A;--basics:#8CC5A6;color-scheme:dark}
:root:not([data-theme="light"]) .search::before{color:#8A9B8F}
:root:not([data-theme="light"]) .search input{background:#1E2721}
:root:not([data-theme="light"]) .search input:focus{background:#232E27;border-color:#4C6A57}
:root:not([data-theme="light"]) .bento-garden{background:#1E2B22;color:#D3E6D8}
:root:not([data-theme="light"]) .bento-tip{background:#2C2619;color:#EBDDC2}
:root:not([data-theme="light"]) .section-heading button{color:#8CC5A6}
:root:not([data-theme="light"]) .catalog-chip{background:#1E2721;color:#B8C6BC}
:root:not([data-theme="light"]) .catalog-chip.active{background:#3F6F59;color:#fff}
:root:not([data-theme="light"]) .tile{background:#171E19;border-color:#27312A}
:root:not([data-theme="light"]) .note{background:#1E2721}
:root:not([data-theme="light"]) .bottom-nav{background:rgba(16,21,18,.92);border-top-color:rgba(255,255,255,.08)}
:root:not([data-theme="light"]) .tab-item{color:#8E9B92}
:root:not([data-theme="light"]) .tab-item.active{color:#8CC5A6}
:root:not([data-theme="light"]) .back{background:#1E2721}
:root:not([data-theme="light"]) .row,:root:not([data-theme="light"]) .topic,:root:not([data-theme="light"]) .nowcard,:root:not([data-theme="light"]) .qcard,:root:not([data-theme="light"]) .task,:root:not([data-theme="light"]) .garden-card,:root:not([data-theme="light"]) .result-card,:root:not([data-theme="light"]) .symptom-card,:root:not([data-theme="light"]) .quickfact,:root:not([data-theme="light"]) .passport{background:#171E19;box-shadow:0 4px 20px rgba(0,0,0,.35)}
:root:not([data-theme="light"]) .chip{background:#1E2721}
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#3F6F59;border-color:#3F6F59;color:#fff}
:root:not([data-theme="light"]) .add-btn{background:#3F6F59;color:#fff}
:root:not([data-theme="light"]) .theme-btn{background:#1E2721;color:#EDF2EC}
}

/* buttons over the photo keep their light glass look in every theme */
:root .hero-bar .glass,:root[data-theme] .hero-bar .glass{background:rgba(255,255,255,.80)!important;color:#1A1D1A!important}
:root .hero-bar .glass.on,:root[data-theme] .hero-bar .glass.on{color:#D1304A!important}

/* пометка «черновик» для непроверенных сортов */
.draft-tag{color:#B26A00;font-weight:700}
.draft-note{background:#FFF4DB;border:1px solid #F0D79A;color:#6B4A00;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;margin:0 0 16px}
:root[data-theme="dark"] .draft-tag{color:#E5A93D}
:root[data-theme="dark"] .draft-note{background:#2C2619;border-color:#4B3F22;color:#EBDDC2}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) .draft-tag{color:#E5A93D}
:root:not([data-theme="light"]) .draft-note{background:#2C2619;border-color:#4B3F22;color:#EBDDC2}
}

/* общий поиск */
.sr-total{font-size:13px;color:var(--muted);margin:2px 2px 6px}
.sr-head{font-size:15px;font-weight:700;margin:18px 2px 8px}
.sr-sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
/* определитель: результат в шторке */
.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.38);border:0;padding:0;width:100%;height:100%}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;width:min(560px,100%);margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.28);max-height:78vh;overflow:auto;animation:sheetin .22s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.sheet .result-title{font-size:26px}
.sheet .result-desc{margin-bottom:14px}
.sheet-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sheet .vlink.wide{width:100%;text-align:center;padding:13px 16px;font-size:15px}
.sheet .vlink.ghost{background:transparent}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}

/* мой сад: изменить и удалить */
.garden-item{margin-bottom:12px}
.garden-actions{display:flex;gap:8px;align-items:center;padding:8px 4px 0}
.g-btn{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:650}
.g-btn.danger{color:#C0392B;border-color:#E7BDB7}
.g-ask{flex:1;font-size:14px;color:var(--muted)}
.form-error{color:#C0392B;font-size:14px;margin:-6px 0 14px}
:root[data-theme="dark"] .g-btn.danger,:root[data-theme="dark"] .form-error{color:#E8857A;border-color:#5A3733}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-btn.danger,:root:not([data-theme="light"]) .form-error{color:#E8857A;border-color:#5A3733}}

/* контурные иконки */
.ico{width:1em;height:1em;display:block;flex:none}
.thumb .ico,.hero-emoji .ico,.slide-ph .ico{color:rgba(255,255,255,.94)}
.hero-emoji .ico,.slide-ph .ico{stroke-width:1.1}
.tile .emoji .ico{color:var(--basics);opacity:.9;stroke-width:1.1}
.t-ic .ico{color:var(--basics)}
.tab-item .tab-icon{display:grid;place-items:center;height:24px}
.tab-icon .ico{width:24px;height:24px;stroke-width:1.7}
.hd-icon .ico{width:24px;height:24px}
.slide::before{display:none}
.slide-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:96px}
/* атмосфера: тон раздела и размытое фото */
#app > .view,.app-clone > .view{position:relative;z-index:1}
.atmo,.atmo-photo,.atmo-veil{position:fixed;inset:0;z-index:0;pointer-events:none}
.atmo{background:radial-gradient(120% 60% at 0% 0%, var(--ta), transparent 72%),radial-gradient(110% 50% at 100% 6%, var(--tb), transparent 72%)}
.atmo[data-tone="home"]{--ta:rgba(111,163,124,.26);--tb:rgba(180,200,150,.18)}
.atmo[data-tone="apple"]{--ta:rgba(217,82,63,.20);--tb:rgba(111,163,124,.22)}
.atmo[data-tone="pear"]{--ta:rgba(185,194,59,.26);--tb:rgba(94,154,107,.20)}
.atmo[data-tone="pest"]{--ta:rgba(176,122,75,.24);--tb:rgba(122,90,58,.16)}
.atmo[data-tone="basics"]{--ta:rgba(79,154,116,.24);--tb:rgba(120,176,127,.16)}
.atmo[data-tone="plan"]{--ta:rgba(62,124,140,.24);--tb:rgba(111,163,124,.16)}
.atmo-photo{background-size:cover;background-position:center;filter:saturate(1.3);opacity:.55}
.atmo-veil{background:rgba(244,246,242,.62)}
:root[data-theme="dark"] .atmo-veil{background:rgba(9,13,11,.6)}
/* матовое стекло на крупных карточках (не на длинных списках) */
.passport,.quickfact,.symptom-card,.garden-card,.task,.nowcard,.result-card{background:rgba(255,255,255,.74)}
:root[data-theme="dark"] .passport,:root[data-theme="dark"] .quickfact,:root[data-theme="dark"] .symptom-card,:root[data-theme="dark"] .garden-card,:root[data-theme="dark"] .task,:root[data-theme="dark"] .nowcard,:root[data-theme="dark"] .result-card{background:rgba(23,30,25,.68)}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) .atmo-veil{background:rgba(9,13,11,.6)}
:root:not([data-theme="light"]) .passport,:root:not([data-theme="light"]) .quickfact,:root:not([data-theme="light"]) .symptom-card,:root:not([data-theme="light"]) .garden-card,:root:not([data-theme="light"]) .task,:root:not([data-theme="light"]) .nowcard,:root:not([data-theme="light"]) .result-card{background:rgba(23,30,25,.68)}
}

/* главная: сорт дня, каталог, инструменты */
.dayhero{position:relative;display:block;width:100%;height:232px;border-radius:28px;overflow:hidden;text-align:left;color:#fff;background:var(--c);box-shadow:0 10px 30px rgba(20,35,22,.16)}
.dayhero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 80% at 85% 10%,rgba(255,255,255,.28),transparent 60%)}
.dh-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dh-ph{position:absolute;right:-8px;top:2px;font-size:168px;line-height:1;opacity:.3}
.dh-ph .ico{color:#fff;stroke-width:1}
.dh-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.64),rgba(0,0,0,0) 64%)}
.dh-top{position:absolute;left:18px;top:16px;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:13px;font-weight:650}
.dh-body{position:absolute;left:20px;right:20px;bottom:18px;display:flex;flex-direction:column;gap:4px}
.dh-name{font-family:var(--font-serif);font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.04}
.dh-sub{font-size:14px;opacity:.92}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool,.slim-btn{display:flex;align-items:center;gap:12px;text-align:left;border-radius:20px;background:rgba(255,255,255,.74);box-shadow:0 4px 18px rgba(25,35,27,.05)}
.tool{padding:14px 14px}
.tool .ico,.slim-btn .ico{width:26px;height:26px;color:var(--basics);flex:none}
.tool b,.slim-btn b{display:block;font-size:15px;line-height:1.2}
.tool small,.slim-btn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.slim-row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.slim-btn{padding:12px 16px;width:100%}
.slim-btn span{flex:1;min-width:0}
.slim-btn i{font-style:normal;font-size:22px;color:var(--muted)}
:root[data-theme="dark"] .tool,:root[data-theme="dark"] .slim-btn{background:rgba(23,30,25,.68)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tool,:root:not([data-theme="light"]) .slim-btn{background:rgba(23,30,25,.68)}}

/* фото на плитках, баннер категории, пометка «иллюстрация» */
.tile.has-photo{background:#2C4A3E;border:0;color:#fff}
.tile-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.has-photo::after{display:block;content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 62%)}
.tile.has-photo .t,.tile.has-photo .n{color:#fff;position:relative;z-index:1}
.tile.has-photo .n{opacity:.9}
.cat-hero{position:relative;height:150px;border-radius:24px;overflow:hidden;margin:0 0 16px;background:#2C4A3E;box-shadow:0 8px 24px rgba(20,35,22,.14)}
.cat-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 65%)}
.cat-hero-t{position:absolute;left:18px;bottom:14px;color:#fff;display:flex;flex-direction:column;gap:2px}
.cat-hero-t b{font-family:var(--font-serif);font-size:28px;letter-spacing:-.03em;line-height:1.05}
.cat-hero-t span{font-size:14px;opacity:.92}
.illus-badge{position:absolute;left:14px;bottom:14px;z-index:3;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;font-weight:650;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dh-illus{position:absolute;right:16px;top:16px;z-index:2;padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.38);color:#fff;font-size:12px;font-weight:650}

/* декоративные растения */
:root{--orn:#7A6BA8}
.atmo[data-tone="orn"]{--ta:rgba(122,107,168,.22);--tb:rgba(111,163,124,.20)}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.checked-note{font-size:13px;font-weight:600;color:#2F6B4F;margin:4px 0 0}
:root[data-theme="dark"] .checked-note{color:#8CC5A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .checked-note{color:#8CC5A6}}
.ver{margin:10px 4px 0;font-size:12px;color:var(--muted);text-align:center}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
input,select,textarea,.search input,.form-group input,.form-group select{font-size:16px !important}
.nav-layer{position:fixed;inset:0;z-index:9999;overflow:hidden;background:var(--bg)}
.nav-pane{position:absolute;inset:0;overflow:hidden;background:var(--bg);will-change:transform}
.nav-top{box-shadow:-10px 0 28px rgba(0,0,0,.16)}
.nav-shade{position:absolute;inset:0;background:#000;opacity:.22;pointer-events:none}
.photo-credit{margin:-8px 0 10px}
.photo-credit summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:9px 2px;font-size:12px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.photo-credit summary::-webkit-details-marker{display:none}
.photo-credit summary::after{content:'›';display:inline-block;font-size:15px;line-height:1;transition:transform .15s}
.photo-credit[open] summary::after{transform:rotate(90deg)}
.photo-credit p{margin:0 0 6px;font-size:11px;line-height:1.45;color:var(--muted)}

const effectiveTheme = () => document.documentElement.getAttribute('data-theme') || (systemDark() ? 'dark' : 'light');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
  const m = document.querySelector && document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t === 'dark' ? '#0E1310' : '#F2F4F1');
}
const toggleTheme = () => applyTheme(effectiveTheme() === 'dark' ? 'light' : 'dark');
try { const st = localStorage.getItem(THEME_KEY); if(st === 'dark' || st === 'light') applyTheme(st); } catch(e) {}
const themeBtn = (cls = '') => {

  return `<button class="theme-btn ${cls}" data-theme-toggle="1" aria-label="${dark ? 'Включить светлую тему' : 'Включить тёмную тему'}">${dark ? '☀︎' : '☾'}</button>`;
};

 {id:"rootstock",emoji:"🌱",title:"Подвой и привой",lead:"Дерево состоит из двух частей: корни даёт подвой, крону и плоды даёт привой (сорт).",sections:[{h:"Что делает подвой",items:["Подвой задаёт силу роста, высоту дерева и срок вступления в плодоношение.","На клоновых подвоях деревья вступают в плодоношение на 5–6 лет раньше, чем на семенных.","Подвои серий М и ММ — основа культуры яблони на клоновых подвоях. В Нидерландах 99% саженцев выращивают на М9."]},{h:"Высота дерева по силе роста подвоя",items:["<b>Очень карликовые</b>: до 2 м.","<b>Карликовые</b>: 2–3 м.","<b>Полукарликовые</b>: 3–4 м.","<b>Сильнорослые</b>: 5–7 м.","<b>Очень сильнорослые</b>: выше 7 м."]},{h:"Примеры",items:["М9 — карликовый подвой: деревья плодоносят на 2–3-й год после посадки (опыт Беларуси).","ММ106 — среднерослый подвой.","Моди и Флорина в опыте в Дагестане были на подвое М9 и плодоносили со второго года."]}],v:["a9","a10"],mo:[],src:"Жабровский И.Е., БГАТУ, «Роль клоновых подвоев яблони в плодоводстве»; журнал «Плодоводство» (Беларусь); Шахмирзоев Р.А., «Современное садоводство», 2021, №1",terms:[]},

 {id:"planting",emoji:"🌳",title:"Посадка саженца",lead:"Саженцы с открытыми корнями сажают весной или осенью. В южных районах возможны оба срока.",sections:[{h:"Сроки",items:["Весной обычно до конца апреля.","Осенью в средней полосе — со второй половины сентября до первой половины октября. В более тёплых районах сроки сдвигаются.","Для весенней посадки яму готовят осенью, для осенней — за 2–3 недели до посадки."]},{h:"Яма и глубина",items:["Размеры ямы источники называют разные: 60–70 см глубиной и 70–80 см шириной, либо глубина около 50 см.","Корневая шейка (переход корня в ствол) после посадки должна быть выше почвы: источники называют 3–5, 5–6 и 6–8 см. Земля в яме оседает, и шейка опускается."]},{h:"После посадки",items:["Обильно полить: 2–3 ведра воды. В сухую погоду повторить полив 2–3 раза.","Мульчировать приствольный круг рыхлой землёй, торфом или перегноем, чтобы сохранить влагу.","Лучше брать саженец не старше двух лет."]}],v:[],mo:[9],src:"Министерство сельского хозяйства Республики Татарстан («Яблоня в Татарстане»); Vikna.tv; azbyka.ru",terms:[]},
 {id:"pruning",emoji:"🪚",title:"Обрезка",lead:"Обрезка управляет формой кроны, освещённостью и плодоношением. Загущенная крона не гарантирует большого урожая.",sections:[{h:"Два приёма",items:["<b>Прореживание</b> — вырезка ветви целиком.","<b>Укорачивание</b> — сокращение ветви.","Срез делают «на кольцо»: по кольцу наплыва, чтобы рана меньше травмировала дерево."]},{h:"Виды обрезки",items:["<b>Санитарная</b> — ежегодно: убрать сухие, больные и повреждённые ветви.","<b>Формирующая</b> — в первые годы жизни (по разным данным 3–5 или до 5–6 лет): создаёт прочную крону.","<b>Регулирующая</b> — управляет ростом и плодоношением.","<b>Омолаживающая</b> — для старых деревьев."]},{h:"Сроки",items:["Санитарную и прореживающую обрезку делают до начала сокодвижения.","На юге осенняя обрезка возможна с конца октября по ноябрь. Источники расходятся: в холодные зимы безопаснее весной."]}],v:[],mo:[3,11],src:"Азбука садовода (azbyka.ru); Министерство сельского хозяйства Республики Татарстан; Халва Медиа; Vikna.tv",terms:[]},
 {id:"pollination",emoji:"🐝",title:"Опыление",lead:"Большинство сортов яблони перекрёстно опыляются: для урожая нужен другой сорт, цветущий в то же время.",sections:[{h:"Главное",items:["Самоплодные сорта лучше завязывают плоды при плохой погоде и малом числе пчёл, но и им опылитель рядом повышает урожай.","Сорт-опылитель должен цвести одновременно с основным.","Не все сорта совместимы: пыльца может не прорастать на рыльце, или пыльцевая трубка не доходит до семязачатка.","Опылители лучше размещать в разных местах сада."]},{h:"Триплоиды",items:["У триплоидных сортов, например Джонаголда, пыльца стерильна. Им нужны два сорта-опылителя, а сами они других не опыляют."]},{h:"Груша",items:["У груши тоже подбирают опылители. Для Вильямса подходят Бере Боск и Конференция.","Во время цветения химические обработки обычно не проводят."]}],v:["a14","a9","p1"],mo:[4],src:"Диссертация «Диагностика самоопыляемости сортов яблони…» (dissercat.com); Wikifarmer; Wikipedia (Jonagold); Cummins Nursery; Werribee Park Heritage Orchard",terms:[]},
 {id:"watering",emoji:"💧",title:"Полив и подкормка",lead:"Плодоносящему саду нужны три вегетационных полива и влагозарядковый полив осенью.",sections:[{h:"Вегетационные поливы",items:["Первый — в июне, после опадения лишней завязи.","Второй — за 2–3 недели до созревания летних сортов (15–20 июля).","Третий — в августе.","После цветения в жару следить за влажностью почвы, вносить органические и минеральные удобрения."]},{h:"Влагозарядковый полив",items:["Проводят осенью после листопада, за несколько дней до устойчивых морозов.","Проверка: земля на глубине 30–50 см. Если ком рассыпается, полив нужен.","Ориентир: 3–4 ведра на молодое дерево, около 10 на взрослое."]},{h:"Подкормка",items:["Весной — азот в начале вегетации.","Осенью — калий в быстроусвояемой форме. Внекорневые подкормки осенью уже не нужны."]}],v:[],mo:[6,7,10],src:"БГАТУ («Капельное орошение сада»); Altapress; azbyka.ru; news.ru; Минсельхоз Кыргызстана",terms:[]},
 {id:"phenophases",emoji:"🌸",title:"Фазы развития дерева",lead:"Обработки и подкормки привязывают к фазам развития дерева, а не к датам. Так сроки подходят и для тёплой, и для холодной весны.",sections:[{h:"Фазы яблони и груши по порядку",items:["<b>Зелёный конус</b>: контактные фунгициды против парши и препарат против зимующих вредителей, до появления листьев.","<b>Мышиное ухо</b>: листья ещё мелкие, дерево готовится к цветению.","<b>Розовый бутон</b>: обработка перед цветением против болезней и вредителей.","<b>Цветение</b>: химические обработки обычно не проводят, следят за заморозками.","<b>Конец цветения (опадение лепестков)</b>: следующая обработка против парши и вредителей. Интервал между обработками 5–14 дней, по погоде.","<b>Рост плодов</b>: поливы, прореживание завязи.","<b>Созревание плодов</b>: соблюдать срок ожидания из инструкции препарата."]}],v:[],mo:[3,4,5],src:"ФосАгро, лекторий (РГАУ-МСХА): фенофазы яблони и груши; Cyberleninka; Adama; Россельхозцентр (Мордовия)",terms:[]},
 {id:"scab",emoji:"🍂",title:"Парша",lead:"Парша — наиболее опасное заболевание яблони. Она появляется как пятна на листьях и плодах.",sections:[{h:"Как развивается",items:["Гриб зимует в опавших листьях.","Весной после дождей выбрасываются споры, заражаются листья и завязи.","Потери урожая на восприимчивых сортах в разных данных от 12–40% до 70% в отдельные годы."]},{h:"Что помогает",items:["Убрать опавшие листья осенью.","Выбрать сорта с иммунитетом: ген Vf получен от дикой яблони Malus floribunda.","Провести обработки по фазам развития."]},{h:"Сорта в приложении",items:["<b>Устойчивы или иммунны</b>: Моди, Флорина, Топаз, Фуджи (по данным NSW DPI). Смотрите фильтр «Устойчивые к парше» в списке яблонь.","<b>Восприимчивы</b>: Гала, Белый налив, Джонаголд, Брэберн; Ренет Симиренко слабо устойчив."]}],v:["a9","a10","a15","a12","a5","a2","a14","a16","a3"],mo:[4,10],src:"Министерство сельского хозяйства Республики Татарстан; Adama; Белорусский институт защиты растений; NSW DPI, Agfact H4.1.12; Agronomy Journal (INRA); Wikipedia",terms:[]},
 {id:"glossary",emoji:"📖",title:"Словарь",lead:"Главные слова из карточек сортов и календаря.",sections:[],terms:[{t:"Сорт",d:"Группа растений с общими свойствами. Размножается прививкой, поэтому деревья одного сорта — клоны."},{t:"Привой",d:"Часть сорта, которую прививают на подвой."},{t:"Подвой",d:"Растение, корни которого несут привитый сорт и влияют на силу роста."},{t:"Клон",d:"Потомство, полученное вегетативно. Все деревья Гренни Смит — клоны исходного дерева."},{t:"Самоплодность",d:"Способность завязывать плоды от собственной пыльцы."},{t:"Триплоид",d:"Сорт с тройным набором хромосом. Пыльца стерильна: нужны два опылителя, сам он других не опыляет (например, Джонаголд)."},{t:"Лёжкость",d:"Способность плодов сохраняться при хранении."},{t:"Съёмная зрелость",d:"Стадия, когда плоды уже можно снимать для хранения или перевозки."},{t:"Фенофаза",d:"Этап развития дерева: зелёный конус, розовый бутон, цветение и другие."},{t:"Ген Vf",d:"Ген иммунитета к парше. Получен от дикой яблони Malus floribunda."},{t:"Потребность в холоде",d:"Число часов низких температур, нужное дереву для нормального цветения."},{t:"Влагозарядковый полив",d:"Осенний обильный полив после листопада, до заморозков."},{t:"Клубный сорт",d:"Сорт, саженцы которого выращивают по лицензии (например, Моди)."}],v:[],mo:[],src:"Составлено по материалам разделов «Основы» и карточек сортов"}
];

 {id:"scab",kind:"Болезнь",emoji:"🍂",title:"Парша",latin:"Venturia inaequalis",lead:"Самая опасная болезнь яблони: пятна на листьях и плодах.",sections:[{h:"Как узнать",items:["Пятна на листьях и плодах.","При сильном поражении листья массово опадают сразу после цветения."]},{h:"Как развивается",items:["Гриб зимует в опавших листьях.","Весной после дождей выбрасываются споры, их разносят ветер и капли дождя.","Заражаются листья и завязи.","Потери урожая на восприимчивых сортах по разным данным: 12–40%, а по другим 40–70%."]},{h:"Что помогает",items:["Осенью убрать опавшие листья.","Сажать сорта с иммунитетом (ген Vf).","Контактные фунгициды в фазах «зелёный конус» — «красная почка», затем по схеме защиты: «розовый бутон» и «конец цветения».","Интервал между обработками 5–14 дней, в зависимости от погоды.","Соблюдать срок ожидания из инструкции препарата."]},{h:"Сорта в приложении",items:["<b>Устойчивы или иммунны</b>: Моди, Флорина, Топаз, Фуджи (по данным NSW DPI).","<b>Восприимчивы</b>: Гала, Белый налив, Джонаголд, Брэберн. Ренет Симиренко слабо устойчив."]}],v:["a9","a10","a15","a12","a5","a2","a14","a16","a3"],mo:[4,5,6,10],fun:"Иммунитет к парше (ген Vf) селекционеры получили от дикой яблони Malus floribunda. Так появилась и Флорина.",src:"Adama (жизненный цикл парши); Министерство сельского хозяйства Республики Татарстан; Белорусский институт защиты растений; NSW DPI, Agfact H4.1.12; Agronomy Journal (INRA)"},
 {id:"mildew",kind:"Болезнь",emoji:"🌫️",title:"Мучнистая роса",latin:"Podosphaera leucotricha",lead:"Белый налёт на молодых листьях и побегах.",sections:[{h:"Как узнать",items:["Серовато-белый мучнистый налёт на молодых листьях. Первые признаки видны уже в конце апреля.","Поражаются листья, побеги, почки и цветки.","Побеги не растут, искривляются и постепенно отмирают."]},{h:"Как развивается",items:["Гриб зимует в верхних почках побегов.","Максимума болезнь достигает в конце июля.","Больные побеги плохо вызревают и зимой вымерзают.","Больные плоды растрескиваются и загнивают."]},{h:"Что помогает",items:["Весной и осенью обрезать и сжигать поражённые побеги.","Обработки по схеме защиты. Препарат и дозу выбирайте по актуальному Госкаталогу.","Выбирать более устойчивые сорта."]},{h:"Сорта в приложении",items:["<b>Восприимчивы</b>: Джонатан (сильно), Айдаред, Гала, Джонаголд, Брэберн.","<b>Устойчивы или частично устойчивы</b>: Топаз, Флорина (по данным питомников), Фуджи (частично)."]}],v:["a7","a6","a5","a14","a16","a15","a10","a12"],mo:[4,5,7],fun:"Гриб мучнистой росы растёт на поверхности листа, а не внутри: это наружный паразит.",src:"Министерство сельского хозяйства Республики Татарстан; Altapress; БСЭ; NSW DPI; Albemarle CiderWorks; Cummins Nursery"},
 {id:"monilia",kind:"Болезнь",emoji:"🍎",title:"Монилиоз (плодовая гниль)",latin:"Monilia fructigena",lead:"Гниль плодов, у семечковых проявляется чаще всего во второй половине лета.",sections:[{h:"Как узнать",items:["Плоды гниют или засыхают, больные плоды остаются висеть на ветках.","Первые признаки заметны во второй половине лета.","У яблони и груши чаще проявляется плодовая гниль, у косточковых ещё и ожог цветков и веток."]},{h:"Как развивается",items:["Гриб проникает через механические повреждения плодов и побегов.","Зимует в поражённых органах. Главный источник инфекции — мумифицированные плоды.","Споры разносят ветер, дождь и насекомые, в том числе плодожорка.","Развитию помогают низины, загущённые кроны и прохладная влажная погода во время цветения."]},{h:"Что помогает",items:["Осенью собрать и уничтожить больные и мумифицированные плоды.","Снимать и хранить плоды без повреждений, больные сразу убирать.","Вырезать больные ветви, перекапывать приствольные круги.","Обработки начинают, когда плоды размером с грецкий орех, и повторяют через 10–15 дней (данные Казахстана).","Плодовая гниль часто идёт вместе с паршой: сначала лечат паршу."]}],v:[],mo:[6,9,10],fun:"Споры гриба переносят насекомые, в том числе яблонная плодожорка.",src:"БСЭ (статья «Монилиоз»); журнал «Караван» (Казахстан); Халва Медиа; Белорусский ГГАУ; «Профиль»"},
 {id:"fireblight",kind:"Болезнь",emoji:"🔥",title:"Бактериальный ожог",latin:"Erwinia amylovora",lead:"Карантинная бактериальная болезнь, поражает все надземные части. Очаги отмечены и в Кабардино-Балкарии.",sections:[{h:"Как узнать",items:["Молодые побеги и ветки сначала словно наливаются жидкостью, затем вянут, буреют и чернеют.","Верхушка побега загибается, получается «пастуший посох».","Поражаются цветки, побеги и плоды."]},{h:"Почему опасен",items:["Инфекция распространяется по восприимчивым растениям очень быстро.","Из плодовых больше всего страдает груша."]},{h:"Что нужно знать",items:["Бактериальный ожог — карантинный объект для России и ЕАЭС. В России его впервые нашли в 2003 году в Калининградской области.","Очаги регистрировали в Кабардино-Балкарии, Дагестане, Карачаево-Черкесии, Краснодарском и Ставропольском краях и других регионах.","Как карантинный объект, он подлежит официальному контролю: при подозрении обращайтесь в службу карантина растений."]},{h:"Сорта в приложении",items:["<b>Восприимчивы по данным карточек</b>: Вильямс, Любимица Клаппа (сильно), Гала, Айдаред, Джонаголд, Брэберн. Топаз умеренно.","Флорина по данным питомников устойчива."]}],v:["p1","p4","a5","a6","a14","a16","a15","a10"],mo:[5,6],fun:"В России болезнь впервые нашли только в 2003 году, а теперь очаги есть и в КБР.",src:"ВНИИКР, «Бактериальный ожог плодовых культур»; журнал «Фитосанитария. Карантин растений», 2020, №4; Гродненский ГАУ; Cummins Nursery"},

const normText = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9\s-]/g, ' ').replace(/\s+/g, ' ').trim();
const stemWord = w => w.length > 6 ? w.slice(0, w.length - 2) : w.length > 4 ? w.slice(0, w.length - 1) : w;
function lev(a, b){
  const m = a.length, n = b.length; if(Math.abs(m - n) > 1) return 2;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
let SEARCH_INDEX = null;
function buildSearchIndex(){
  const idx = [];
  VARIETIES.forEach(v => idx.push({type: v.cat === 'orn' ? 'orn' : 'variety', v, title: normText(v.name + ' ' + (v.latin || '')),
    text: normText([v.name, v.latin, v.kind, catById[v.cat].title, v.origin, v.parents, v.season, v.taste, v.bloom, v.crown, v.light, v.soil, v.fun, (v.facts || []).join(' ')].join(' '))}));
  PESTS.forEach(p => {
    const sy = DIAGNOSTICS.filter(d => d.pestId === p.id).map(d => d.symptom + ' ' + d.desc).join(' ');
    idx.push({type:'pest', p, title: normText(p.title + ' ' + (p.latin || '')),
      text: normText([p.title, p.latin, p.kind, p.lead, sy, p.sections.map(s => s.h + ' ' + s.items.join(' ')).join(' ')].join(' '))});
  });
  BASICS.forEach(b => {
    (b.terms || []).forEach(tm => idx.push({type:'term', b, tm, title: normText(tm.t), text: normText(tm.t + ' ' + tm.d)}));
    idx.push({type:'topic', b, title: normText(b.title), text: normText([b.title, b.lead, (b.sections || []).map(s => s.h + ' ' + s.items.join(' ')).join(' ')].join(' '))});
  });
  CAL.forEach(m => m.tasks.forEach(tk => idx.push({type:'task', m, tk, title: normText(tk.s + ' ' + tk.tag),
    text: normText([MONTHS[m.m - 1], m.phase, tk.tag, tk.s, tk.t, tk.note].join(' '))})));
  return idx;
}
function scoreEntry(e, toks, fuzzy){
  let score = 0;
  for(const tk of toks){
    const st = stemWord(tk);
    if(e.title.startsWith(st)) score += 13;
    else if(e.title.includes(st)) score += 10;
    else if(e.text.includes(st)) score += 2;
    else if(fuzzy && tk.length >= 5 && e.text.split(' ').some(w => w.length >= st.length - 1 && lev(w.slice(0, st.length), st) <= 1)) score += 1;
    else return 0;
  }
  return score;
}
const srBtn = (attr, emoji, title, sub) => `<button class="topic" ${attr}><span class="t-ic" aria-hidden="true">${emoji}</span><span class="t-tx"><span class="t-t">${title}</span><span class="t-l">${sub}</span></span></button>`;
const cut = (s, n) => s.length > n ? s.slice(0, n - 1).trim() + '…' : s;
function searchAll(q){
  const toks = normText(q).split(' ').filter(Boolean);
  if(!toks.length) return {groups: [], total: 0};
  if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
  let hits = SEARCH_INDEX.map(e => ({e, s: scoreEntry(e, toks, false)})).filter(x => x.s > 0);
  if(!hits.length) hits = SEARCH_INDEX.map(e => ({e, s: scoreEntry(e, toks, true)})).filter(x => x.s > 0);
  hits.sort((a, b) => b.s - a.s);
  const groups = [];
  const add = (title, type, limit, render) => {
    const list = hits.filter(h => h.e.type === type);
    if(list.length) groups.push({title, count: list.length, best: list[0].s, items: list.slice(0, limit).map(h => render(h.e))});
  };
  add('Сорта', 'variety', 10, e => rowHtml(e.v));
  add('Декоративные растения', 'orn', 10, e => rowHtml(e.v));
  add('Болезни и вредители', 'pest', 7, e => srBtn(`data-pest="${e.p.id}"`, e.p.emoji, e.p.title, `${e.p.kind} · ${cut(e.p.lead, 80)}`));
  add('Основы', 'topic', 7, e => srBtn(`data-topic="${e.b.id}"`, e.b.emoji, e.b.title, cut(e.b.lead, 90)));
  add('Словарь', 'term', 6, e => srBtn('data-topic="glossary"', '📖', e.tm.t, cut(e.tm.d, 90)));
  add('Календарь работ', 'task', 8, e => srBtn(`data-mgo="${e.m.m}"`, '📅', e.tk.s, `${MONTHS[e.m.m - 1]} · ${e.tk.tag}`));
  groups.sort((a, b) => b.best - a.best);
  return {groups, total: hits.length};
}
let lastSearchCount = 0;
function searchResultsHtml(q){
  const res = searchAll(q);
  const toks = normText(q).split(' ').filter(Boolean);
  const match = text => { const n = normText(text); return toks.length > 0 && toks.every(tk => n.includes(stemWord(tk))); };
  const yearNow = new Date().getFullYear();
  const ageWord = a => a === 1 ? 'год' : a > 1 && a < 5 ? 'года' : 'лет';
  const gardenHits = getGarden().map(t => ({t, v: VARIETIES.find(x => x.id === t.sortId)}))
    .filter(({t, v}) => match((v ? v.name : (t.customName || '')) + ' ' + (t.place || '')));
  const favHits = VARIETIES.filter(v => favs.has(v.id) && match(v.name));
  const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const extra = [];
  if(gardenHits.length) extra.push(`<p class="sr-head">У вас в саду · ${gardenHits.length}</p>` + gardenHits.map(({t, v}) =>
    srBtn('data-go="garden"', '🌳', esc(v ? v.name : t.customName), `${esc(t.place || 'Без места')} · ${yearNow - t.year} ${ageWord(yearNow - t.year)}`)).join(''));
  if(favHits.length) extra.push(`<p class="sr-head">В избранном · ${favHits.length}</p>` + favHits.map(v =>
    srBtn(`data-id="${v.id}"`, '♥', v.name, catById[v.cat].title)).join(''));
  const total = res.total + gardenHits.length;
  lastSearchCount = total;
  if(!total) return `<div class="empty">Ничего не найдено. Попробуйте:<div class="sr-sugg">${['парша','обрезка','Гала','влагозарядковый полив','октябрь'].map(x => `<button class="chip" data-q="${x}">${x}</button>`).join('')}</div></div>`;
  return `<p class="sr-total">Найдено: ${total}</p>` + extra.join('') + res.groups.map(g => `<p class="sr-head">${g.title} · ${g.count}</p>${g.items.join('')}`).join('');
}

const list = a => a && a.length ? `<ul class="bul">${a.map(x => `<li>${x}</li>`).join('')}</ul>` : '';

const commonsPhoto = c => {
  const f = encodeURIComponent(c.file);
  return {src:`https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=960`,
          credit:[c.author, c.license, 'Wikimedia Commons'].filter(Boolean).join(', '),
          source:`https://commons.wikimedia.org/wiki/File:${f}`,
          caption:c.caption || 'Плод'};
};
const photoList = v => {
  const first = v.commons ? [commonsPhoto(v.commons)]
              : v.image ? [{src:v.image, credit:v.imageCredit, source:v.imageSource, caption:v.imageCaption || 'Плод', full:!!v.imageFull}] : [];
  const more = (v.gallery || []).map(x => typeof x === 'string' ? {src:x} : x.file ? commonsPhoto(x) : x);
  return [...first, ...more];
};
const photoCredits = ps => ps.filter(p => p.credit || p.source).map((p,i) =>
  `Фото${ps.length > 1 ? ' ' + (i + 1) : ''}: ${p.source ? `<a href="${p.source}" target="_blank" rel="noopener noreferrer">${p.credit || 'источник изображения'}</a>` : p.credit}.`).join(' ');
const checkedLabel = s => { const [y, m] = String(s).split('-'); return (MONTHS[(+m || 1) - 1] || '').toLowerCase() + ' ' + y; };
const prow = (label, value, note, cls='') => `<div class="prow ${cls}"><dt>${label}</dt><dd>${value}${note ? `<small>${note}</small>` : ''}</dd></div>`;

      <div class="hero-bar">

    ${v.status === 'draft' ? `<div class="draft-note"><b>Не проверено по источникам.</b> Это черновик: год, происхождение и свойства могут быть неточными. Сверяйте с Госреестром и научными источниками.</div>` : ''}

function rateHtml(v){
  const t = v.tasting, mine = myRates[v.id] || 0;
  const stars = [1,2,3,4,5].map(n => `<button class="star ${n <= mine ? 'on' : ''}" data-rate="${v.id}" data-stars="${n}" aria-label="Оценка ${n} из 5" aria-pressed="${n <= mine}">${svgIcon('star')}</button>`).join('');
  return `<h3 class="passport-title">Оценки</h3>
    <div class="rates">
      <div class="quickfact rate-off">
        <span class="q-label">ДЕГУСТАЦИОННАЯ ОЦЕНКА ВКУСА</span>
        ${t ? `<span class="q-value rate-num">${t.score}<small> из 5</small></span>${t.look ? `<span class="q-note rate-look">Внешний вид — <b>${t.look}</b></span>` : ''}<span class="q-note">${t.src}</span>`
            : `<span class="q-value unk">Нет данных</span><span class="q-note">Официальной оценки по 5-балльной шкале в источниках не нашлось</span>`}
      </div>
      <div class="quickfact rate-my">
        <span class="q-label">ВАША ОЦЕНКА</span>
        <span class="stars" role="group" aria-label="Ваша оценка">${stars}</span>
        <span class="q-note">${mine ? 'Нажмите ту же звезду, чтобы сбросить' : 'Нажмите на звезду. Оценка хранится только на этом телефоне'}</span>
      </div>
    </div>`;
}

    <button class="cb" data-task="${mm}:${t.id}" aria-pressed="${on}" aria-label="Отметить выполненным">${on ? '✓' : ''}</button>

let gardenMem = [];
function getGarden() {
  try { return JSON.parse(localStorage.getItem('sad_garden') || '[]'); } catch(e) { return gardenMem; }
}
function saveGarden(garden) {
  gardenMem = garden;
  try { localStorage.setItem('sad_garden', JSON.stringify(garden)); } catch(e) {}
}

  const garden = getGarden();
  const currentYear = new Date().getFullYear();
  const editing = state.editTree ? garden.find(x => x.id === state.editTree) : null;

  if (state.formOpen) {
    const cur = editing || {sortId: '', customName: '', year: currentYear, place: ''};
    const esc = s => String(s || '').replace(/"/g, '&quot;');

const catById = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const count = id => VARIETIES.filter(v => v.cat === id).length;
const plantWord = n => (n % 10 === 1 && n % 100 !== 11) ? 'растение' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'растения' : 'растений';
const plural = n => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?'сорт':(m10>=2&&m10<=4&&(m100<10||m100>=20))?'сорта':'сортов'; };


/* ---------- Запоминание прокрутки: «Назад» возвращает туда, где вы были ---------- */
const scrollMem = {};
let navMode = 'forward', lastViewKey = '';
const viewKey = () => {
  const s = state.screen;
  return s === 'detail' ? 'detail|' + state.id : s === 'cat' ? 'cat|' + state.cat + '|' + state.filter : s === 'topic' ? 'topic|' + state.topic
       : s === 'pest' ? 'pest|' + state.pest : s === 'cal' ? 'cal|' + state.month : s === 'diag' ? 'diag|' + diagState.crop
       : s === 'pests' ? 'pests|' + state.pestFilter : s;
};
['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => { if(e.preventDefault) e.preventDefault(); }));
document.addEventListener('touchmove', e => { if(e.touches && e.touches.length > 1 && e.preventDefault) e.preventDefault(); }, {passive:false});
const rememberScroll = () => { scrollMem[viewKey()] = window.scrollY || window.pageYOffset || 0; };

/* ---------- История переходов: системная кнопка «Назад», «Назад» в браузере и ссылки на разделы ---------- */
const realHistory = typeof history !== 'undefined' && !!history && typeof history.pushState === 'function' && typeof location !== 'undefined';
// iPhone, приложение с домашнего экрана: системный жест «Назад» открывает белую подложку, поэтому там своя цепочка экранов и свой жест
const ownNav = realHistory && typeof navigator !== 'undefined' && navigator.standalone === true;
const hasHistory = realHistory;
let histIndex = 0, histReady = false, histKey = null, curSnap = null, restoring = false, lastPop = 0, pendingAfterPop = null, replaceNext = false;
const TAB_SCREENS = ['home', 'catalog', 'cal', 'garden'];   // экраны нижней панели: это «корни», у них нет шага назад
const histScreens = [];
const H = ownNav ? makeVirtualHistory() : (realHistory ? history : null);
const NAV_KEYS = ['screen','cat','id','filter','query','back','month','topic','pest','pestFilter','pestBack','topicBack','editTree'];
const NAV_DEFAULT = {screen:'home', cat:null, id:null, filter:'Все', query:'', back:'home', month:null, topic:null, pest:null, pestFilter:'Все', pestBack:'pests', topicBack:'basics', editTree:null};
// «Экран» для истории: фильтры и месяцы не создают новых шагов
const navKey = () => { const s = state.screen; return s === 'detail' ? 'detail|' + state.id : s === 'cat' ? 'cat|' + state.cat : s === 'topic' ? 'topic|' + state.topic : s === 'pest' ? 'pest|' + state.pest : s; };
const navSnap = () => { const o = {}; NAV_KEYS.forEach(k => { o[k] = state[k]; }); o.diagCrop = diagState.crop; return o; };
const homeUrl = () => location.pathname + location.search;
const hashFor = sn => {
  const e = encodeURIComponent;
  return sn.screen === 'detail' ? '#/v/' + e(sn.id) : sn.screen === 'cat' ? '#/c/' + e(sn.cat) : sn.screen === 'pest' ? '#/p/' + e(sn.pest)
       : sn.screen === 'topic' ? '#/t/' + e(sn.topic) : sn.screen === 'home' ? homeUrl() : '#/' + sn.screen;
};
function snapFromHash(h){
  const parts = String(h || '').replace(/^#\/?/, '').split('/'); const a = parts[0]; let b = '';
  try { b = parts[1] ? decodeURIComponent(parts[1]) : ''; } catch(e) {}
  if(a === 'v'){ const v = VARIETIES.find(x => x.id === b); if(v) return {screen:'detail', id:b, cat:v.cat, back:'home'}; }
  if(a === 'c' && catById[b] && !catById[b].soon && VARIETIES.some(x => x.cat === b)) return {screen:'cat', cat:b, filter:'Все'};
  if(a === 'p' && PESTS.some(x => x.id === b)) return {screen:'pest', pest:b, pestBack:'pests'};
  if(a === 't' && BASICS.some(x => x.id === b)) return {screen:'topic', topic:b, topicBack:'basics'};
  if(['cal','garden','favs','pests','basics','quiz','catalog','diag'].includes(a)) return {screen:a};
  return null;
}
function applySnap(sn){
  NAV_KEYS.forEach(k => { state[k] = (sn && k in sn) ? sn[k] : (k === 'month' ? nowMonth : NAV_DEFAULT[k]); });
  const okId = state.screen !== 'detail' || VARIETIES.some(x => x.id === state.id);
  const okCat = state.screen !== 'cat' || (catById[state.cat] && !catById[state.cat].soon);
  const okPest = state.screen !== 'pest' || PESTS.some(x => x.id === state.pest);
  const okTopic = state.screen !== 'topic' || BASICS.some(x => x.id === state.topic);
  if(!(okId && okCat && okPest && okTopic)) NAV_KEYS.forEach(k => { state[k] = k === 'month' ? nowMonth : NAV_DEFAULT[k]; });
  state.formOpen = false; state.confirmDel = null; state.formError = '';
  diagState.symptom = null; if(sn && sn.diagCrop) diagState.crop = sn.diagCrop;
  if(state.screen === 'quiz' && !state.quiz) newCard();
}
function initNav(){
  if(!hasHistory || histReady) return; histReady = true;
  try { H.scrollRestoration = 'manual'; } catch(e) {}      // место на странице восстанавливаем сами, иначе Safari возвращает наверх
  try {
    const st = H.state;
    if(st && st.sad && st.snap){ histIndex = st.idx || 0; applySnap(st.snap); histScreens[histIndex] = state.screen; }          // перезагрузка: тот же экран
    else {
      const sn = snapFromHash(location.hash);
      applySnap(null); const base = navSnap();
      H.replaceState({sad:true, idx:0, snap:base}, '', homeUrl());
      histIndex = 0; histScreens[0] = 'home';
      if(sn && TAB_SCREENS.includes(sn.screen)){ applySnap(sn); histScreens[0] = state.screen; H.replaceState({sad:true, idx:0, snap:navSnap()}, '', hashFor(navSnap())); }
      else if(sn){ applySnap(sn); histIndex = 1; histScreens[1] = state.screen; H.pushState({sad:true, idx:1, snap:navSnap()}, '', hashFor(navSnap())); }   // ссылка на сорт или раздел: под ней «домой»
    }
  } catch(e) {}
  histKey = navKey(); curSnap = navSnap();
}
function syncHistory(){
  if(!hasHistory || !histReady) return;
  const k = navKey(), sn = navSnap();
  const asRoot = replaceNext; replaceNext = false;
  if(restoring){ histKey = k; curSnap = sn; return; }
  if(k !== histKey && asRoot){
    try { H.replaceState({sad:true, idx:histIndex, snap:sn}, '', hashFor(sn)); histScreens[histIndex] = sn.screen; } catch(e) {}
    histKey = k;
  } else if(k !== histKey){
    try {
      H.replaceState({sad:true, idx:histIndex, snap:curSnap}, '');     // запоминаем, в каком виде оставили прежний экран
      histIndex++;
      H.pushState({sad:true, idx:histIndex, snap:sn}, '', hashFor(sn));
      histScreens[histIndex] = sn.screen;
    } catch(e) {}
    histKey = k;
  }
  curSnap = sn;
}
// «Назад»: на предыдущий экран; а если кнопка ведёт на главный, а до него больше одного шага, цепочка сбрасывается до главного
const goBack = target => {
  if(!hasHistory || histIndex <= 0) return false;
  const reset = target === 'home' && histIndex > 1 && histScreens[histIndex - 1] !== 'home';
  const run = () => { rememberScroll(); navMode = 'back'; if(reset) H.go(-histIndex); else H.back(); };
  if(ownNav){ if(!sliding) slideBack(run, reset ? -histIndex : -1); return true; }
  run(); return true;
};
// Вкладки нижней панели: сначала вернуться к главному экрану (сбросить цепочку), потом открыть вкладку
const goRoot = fn => { if(hasHistory && histIndex > 0){ pendingAfterPop = fn; H.go(-histIndex); } else fn(); };

// Своя цепочка экранов для iPhone: то же, что history, но без записи в историю браузера (значит, без системного жеста)
function makeVirtualHistory(){
  let entries = [{state: null, url: ''}], i = 0;
  try {
    const s = JSON.parse(sessionStorage.getItem('sad-vh') || 'null');
    if(s && Array.isArray(s.e) && s.e.length && typeof s.i === 'number'){ entries = s.e; i = Math.max(0, Math.min(s.i, entries.length - 1)); }
  } catch(e) {}
  const save = () => { try { sessionStorage.setItem('sad-vh', JSON.stringify({e: entries, i})); } catch(e) {} };
  const fire = () => { save(); handlePop(entries[i].state); };
  return {
    get state(){ return entries[i].state; },
    scrollRestoration: 'manual',
    pushState(st, tt, url){ entries.splice(i + 1); entries.push({state: st, url: url || ''}); i++; save(); },
    replaceState(st, tt, url){ entries[i] = {state: st, url: url === undefined ? entries[i].url : url}; save(); },
    back(){ if(i > 0){ i--; fire(); } },
    go(n){ const j = Math.max(0, Math.min(entries.length - 1, i + n)); if(j !== i){ i = j; fire(); } },
    snapAt(n){ const e = entries[i + n]; return e && e.state ? e.state.snap : null; }
  };
}
function handlePop(st){
  if(!st || !st.sad || !st.snap) return;
  closeZoom();
  lastPop = Date.now();
  rememberScroll();                       // прокрутка экрана, который покидаем
  restoring = true; navMode = 'back'; histIndex = st.idx || 0;
  applySnap(st.snap);
  try { render(); } finally { restoring = false; }
  if(pendingAfterPop){ const f = pendingAfterPop; pendingAfterPop = null; if(histIndex === 0) f(); }
}
